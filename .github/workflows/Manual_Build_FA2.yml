# This workflow will:
# - Create a new Github release
# - Build wheels for supported architectures
# - Deploy the wheels to the Github release
# - Release the static code to PyPi
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Manual build FA 2 wheel package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本：若为 commit、tag、version 则自动获取'
        default: 'commit'
        required: true
        type: string
      python_version:
        description: 'python_version: multiple versions separated by ;'
        default: '3.10'
        required: true
        type: string
      torch_version:
        description: 'torch version: multiple versions separated by ;'
        default: '2.7.0'
        required: true
        type: string
      cuda_version:
        description: 'cuda version: multiple versions separated by ;'
        default: '12.8.1'
        required: true
        type: string
      cxx11_abi:
        description: 'cxx11 abi: multiple options: TRUE, FALSE, separated by ;'
        default: 'FALSE'
        required: true
        type: string
      exclude_list:
        description: 'exclude list: multiple versions separated by ;'
        default: 'th=2.4.1,cu=12.1.0'
        required: true
        type: string
      os_version:
        description: 'os version: ubuntu-latest, ubuntu-24.04, ubuntu-22.04'
        default: 'ubuntu-22.04'
        required: true
        type: string
      upload_artifact:
        description: 'upload artifact: 0 or 1'
        default: '0'
        required: true
        type: string
      addl_info:
        description: 'additional information'
        default: ''
        required: false
        type: string

permissions:
  contents: write

jobs:
  set_ver:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:


      - name: Set matrix
        id: set-matrix
        run: |
          python <<EOF
          import os, json
          py_version = os.getenv("PYTHON_VERSION").split(";")
          torch_versions = os.getenv("TORCH_VERSION").split(";")
          cuda_versions = os.getenv("CUDA_VERSION").split(";")
          cxx11_abi = os.getenv("CXX11_ABI").split(";")
          exclude_text = os.getenv("EXCLUDE_TEXT").split(';')
          exclude_list = []; exclude_text_list= []

          def split_text(text):
              result = []
              for pair in text:
                  items = pair.split(',')
                  if len(items) == 2:
                      temp = [None, None]
                      for item in items:
                          key, value = item.split('=')
                          if key == 'th':
                              temp[0] = value
                          elif key == 'cu':
                              temp[1] = value
                      result.append(temp)
              return result
          exclude_text_list = split_text(exclude_text)

          for py_v in py_version:
              for torch_v in torch_versions:
                  for cuda_v in cuda_versions:
                      for abi in cxx11_abi:
                          if [torch_v, cuda_v] in exclude_text_list:
                              exclude_list.append({
                                      "python_ver": py_v,
                                      "torch_ver": torch_v,
                                      "cuda_ver": cuda_v,
                                      "cxx11_abi": abi
                              })
          matrix = {
              "python_ver" : py_version,
              "torch_ver" : torch_versions,
              "cuda_ver" : cuda_versions,
              "cxx11_abi": cxx11_abi,
              "include": [],
              "exclude": exclude_list,
          }
          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          print(matrix)
          EOF
        shell: bash
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
          TORCH_VERSION: ${{ inputs.torch_version }}  
          CUDA_VERSION: ${{ inputs.cuda_version }}
          CXX11_ABI: ${{ inputs.cxx11_abi }}
          EXCLUDE_TEXT: ${{ inputs.exclude_list }}
        
  wheel:
    name: ${{ inputs.os_version }}-py${{ matrix.python_ver }}-th${{ matrix.torch_ver }}-cu${{ matrix.cuda_ver }}
    needs: set_ver
    runs-on: ${{ inputs.os_version }}

    strategy:
      matrix: ${{ fromJSON(needs.set_ver.outputs.matrix) }}
    steps:
      
      - name: Checkout
        uses: actions/checkout@v4.1.7
        # with:
        #   ref: ${{ steps.determine_version.outputs.d_ver }}
        #   submodules: false    

      - name: Determine version
        id: determine_version
        run: |
          case "${{ inputs.version }}" in
            commit)
              version="$(git rev-parse --short HEAD)"
              ;;
            tag)
              version="git-$(git describe --tags --abbrev=0)"
              ;;
            version)
              if [ -f VERSION ]; then
                version=$(cat VERSION)
              else
                version="${{ inputs.version }}"
              fi
              ;;
            *)
              version="${{ inputs.version }}"
              ;;
          esac
          echo "d_ver=$version" >> $GITHUB_OUTPUT
          
      - name: Print release tag
        run: |
          echo ${{ inputs.addl_info }}-${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-th${{ matrix.torch_ver }}-cu${{ matrix.cuda_ver }}-${{ inputs.os_version }}
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: ${{ matrix.python_ver }}

      - name: Set CUDA and PyTorch versions
        run: |
          echo "MATRIX_CUDA_VERSION=$(echo ${{ matrix.cuda_ver }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          echo "MATRIX_TORCH_VERSION=$(echo ${{ matrix.torch_ver }} | awk -F \. {'print $1 "." $2'})" >> $GITHUB_ENV
          echo "WHEEL_CUDA_VERSION=$(echo ${{ matrix.cuda_ver }} | awk -F \. {'print $1'})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ matrix.python_ver }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV

      - name: Free up disk space
        if: ${{ runner.os == 'Linux' }}
        # https://github.com/easimon/maximize-build-space/blob/master/action.yml
        # https://github.com/easimon/maximize-build-space/tree/test-report
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install CUDA ${{ matrix.cuda_ver }}
        if: ${{ matrix.cuda_ver != 'cpu' }}
        uses: Jimver/cuda-toolkit@v0.2.23
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda_ver }}
          linux-local-args: '["--toolkit"]'
          # default method is "local", and we're hitting some error with caching for CUDA 11.8 and 12.1
          # method: ${{ (matrix.cuda_ver == '11.8.0' || matrix.cuda_ver == '12.1.0') && 'network' || 'local' }}
          method: 'network'
          # We need the cuda libraries (e.g. cuSparse, cuSolver) for compiling PyTorch extensions,
          # not just nvcc
          sub-packages: '["nvcc"]'

      - name: Install PyTorch ${{ matrix.torch-version }}+cu${{ matrix.cuda-version }}
        run: |
          pip install --upgrade pip
          # With python 3.13 and torch 2.5.1, unless we update typing-extensions, we get error
          # AttributeError: attribute '__default__' of 'typing.ParamSpec' objects is not writable
          pip install typing-extensions==4.12.2
          # We want to figure out the CUDA version to download pytorch
          # e.g. we can have system CUDA version being 11.7 but if torch==1.12 then we need to download the wheel from cu116
          # see https://github.com/pytorch/pytorch/blob/main/RELEASE.md#release-compatibility-matrix
          # This code is ugly, maybe there's a better way to do this.
          export TORCH_CUDA_VERSION=$(python -c "from os import environ as env; \
            minv = {'2.4': 118, '2.5': 118, '2.6': 118, '2.7': 118}[env['MATRIX_TORCH_VERSION']]; \
            maxv = {'2.4': 124, '2.5': 124, '2.6': 126, '2.7': 128}[env['MATRIX_TORCH_VERSION']]; \
            print(minv if int(env['MATRIX_CUDA_VERSION']) < 120 else maxv)" \
          )
          if [[ ${{ matrix.torch-version }} == *"dev"* ]]; then
            # pip install --no-cache-dir --pre torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}
            # Can't use --no-deps because we need cudnn etc.
            # Hard-coding this version of pytorch-triton for torch 2.6.0.dev20241001
            pip install jinja2
            pip install https://download.pytorch.org/whl/nightly/pytorch_triton-3.1.0%2Bcf34004b8a-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-linux_x86_64.whl
            pip install --no-cache-dir --pre https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}/torch-${{ matrix.torch-version }}%2Bcu${TORCH_CUDA_VERSION}-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-linux_x86_64.whl
          else
            pip install --no-cache-dir torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cu${TORCH_CUDA_VERSION}
          fi
          gcc --version
          nvcc --version && python --version
          python -c "import torch; from torch.utils import cpp_extension; \
            print('PyTorch:', torch.__version__); \
            print('CUDA:', torch.version.cuda); \
            print('CUDA_HOME:', cpp_extension.CUDA_HOME)"
        shell: bash

      - name: Build wheel
        id: build_wheel
        run: |
          # We want setuptools >= 49.6.0 otherwise we can't compile the extension if system CUDA version is 11.7 and pytorch cuda version is 11.6
          # https://github.com/pytorch/pytorch/blob/664058fa83f1d8eede5d66418abff6e20bd76ca8/torch/utils/cpp_extension.py#L810
          # However this still fails so I'm using a newer version of setuptools
          pip install setuptools==75.8.0
          pip install ninja packaging wheel
          export PATH=/usr/local/nvidia/bin:/usr/local/nvidia/lib64:$PATH
          export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/cuda/lib64:$LD_LIBRARY_PATH
          # Limit MAX_JOBS otherwise the github runner goes OOM
          # nvcc 11.8 can compile with 2 jobs, but nvcc 12.3 goes OOM
          MAX_JOBS=$([[ "$MATRIX_CUDA_VERSION" == "128" ]] && echo 1 || echo 2) FLASH_ATTENTION_FORCE_BUILD="TRUE" FLASH_ATTENTION_FORCE_CXX11_ABI=${{ matrix.cxx11_abi}} python setup.py bdist_wheel --dist-dir=dist
          tmpname=cu${WHEEL_CUDA_VERSION}torch${MATRIX_TORCH_VERSION}cxx11abi${{ matrix.cxx11_abi }}
          get_wheel_name=$(ls dist/*whl | xargs -n 1 basename | sed "s/-/+$tmpname-/2")
          ls dist/*whl |xargs -I {} mv {} dist/${get_wheel_name}
          echo "wheel_name=${{ github.workspace }}/dist/${get_wheel_name}" >> $GITHUB_ENV
        shell: bash

      - name: Print wheel path
        id: wheel_path
        run: |
          ls -lh dist
          get_wheel_path=$(find ${{ github.workspace }}/dist/ -name "*.whl")
          echo "wheel_path=$get_wheel_path" >> "$GITHUB_OUTPUT"
          echo "wheel path: $get_wheel_path"
          echo "wheel name: ${{ env.wheel_name }}"
        shell: bash

      - name: Upload artifact
        if: ${{ inputs.upload_artifact == '1' }}
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{inputs.addl_info}}-${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-th${{ matrix.torch_ver }}-cu${{ matrix.cuda_ver }}-${{matrix.os_version}}-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ steps.build_wheel.outputs.wheel_name }}

      - uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ inputs.addl_info }}-${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-th${{ matrix.torch_ver }}-cu${{ matrix.cuda_ver }}-${{ inputs.os_version }}
          files: |
            ${{  steps.wheel_path.outputs.wheel_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
